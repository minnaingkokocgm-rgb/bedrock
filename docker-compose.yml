services:
  app:
    build:
      context: .
      target: app
    image: bedrock-app:latest
    restart: unless-stopped
    container_name: bedrock-app
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: "true"
      RUN_OPTIMIZE: ${RUN_OPTIMIZE:-true}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-720}
    volumes:
      - laravel_storage:/var/www/html/storage/app
      - laravel_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/app-ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker:
    build:
      context: .
      target: app
    image: bedrock-app:latest
    restart: unless-stopped
    container_name: bedrock-worker
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: worker
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-720}
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "database",
        "--sleep=3",
        "--tries=2",
        "--timeout=660",
        "--max-time=3600",
      ]
    volumes:
      - laravel_storage:/var/www/html/storage/app
      - laravel_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build:
      context: .
      target: app
    image: bedrock-app:latest
    restart: unless-stopped
    container_name: bedrock-scheduler
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: scheduler
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-720}
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - laravel_storage:/var/www/html/storage/app
      - laravel_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy

  nginx:
    build:
      context: .
      target: nginx
    image: bedrock-nginx:latest
    restart: unless-stopped
    container_name: bedrock-nginx
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  laravel_storage:
  laravel_logs:
